name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build HRResumeRegistryAssistantSetup.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\dist\build_logs | Out-Null
          try {
            .\packaging\build_windows.ps1 -UseCurrentPython *>&1 | Tee-Object .\dist\build_logs\windows-build.log
          }
          catch {
            $_ | Out-File -FilePath .\dist\build_logs\windows-build.log -Append
            throw
          }

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-log
          path: dist/build_logs/windows-build.log
          if-no-files-found: warn

      - name: Publish build diagnostics summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ".\dist\build_logs\windows-build.log") {
            "## Windows build log" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content ".\dist\build_logs\windows-build.log" -Tail 120 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Verify artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path ".\dist\HRResumeRegistryAssistant.exe")) {
            throw "Standalone EXE was not created"
          }
          if (-not (Test-Path ".\dist\installer\HRResumeRegistryAssistantSetup.exe")) {
            throw "Installer EXE was not created"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: HRResumeRegistryAssistant-Windows
          path: |
            dist/HRResumeRegistryAssistant.exe
            dist/installer/HRResumeRegistryAssistantSetup.exe
            packaging/INSTALL_INSTRUCTIONS.txt
          if-no-files-found: error

      - name: Publish GitHub release installer
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.2
        run: |
          $notes = @"
          Fully working Windows installer build.

          Fixes:
          - .doc resumes no longer require LibreOffice for matching.
          - Existing old .doc LibreOffice errors are repaired on startup and before matching.
          - OneDrive/cloud folder placeholders no longer break folder scanning.
          - Excel remains the source list; missing resumes are expected and handled.

          Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          Commit: $env:GITHUB_SHA
          "@
          if (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null) {
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "HR Resume Registry Assistant $env:RELEASE_TAG" --notes $notes
          } else {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "HR Resume Registry Assistant $env:RELEASE_TAG" --notes $notes
          }
          gh release upload $env:RELEASE_TAG ".\dist\installer\HRResumeRegistryAssistantSetup.exe" --repo $env:GITHUB_REPOSITORY --clobber
